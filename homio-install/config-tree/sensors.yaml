# Homio template sensors — MISSING from the Nov 24 install, required by the dashboard.
# Provenance: verbatim from upstream Homio (homio-upstream/sensors.yaml).
# The nav clock card (dashboards/templates/button_cards/base/homio_time.yaml)
# reads states["sensor.current_time"].state with no guard, so without this
# file the nav renders buttoncardJSTemplateError.
# Install: copy to /config/sensors.yaml, add `template: !include sensors.yaml`
# to configuration.yaml (merge if a `template:` key already exists), Check
# configuration, restart Home Assistant, verify sensor.current_time exists.
# Template entities can then be reloaded without restart for later edits.
# Template Sensors
- sensor:
    - name: Current Date
      state: >
        {% set days = ["st", "nd", "rd"] %}
        {% set day = now().day %}
        {{ now().strftime('%A ') }}{{ day }}{{ days[day-1] if day in range(1, 4)
        and day not in range(11, 14) else 'th' }} {{ now().strftime('%B %Y') }}
    - name: Current Time
      state: "{{ now().strftime('%H:%M') }}"
