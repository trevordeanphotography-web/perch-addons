# Nav list for The Perch — mirrors Trevor's Google Home rooms 1:1.
# One entry per room page in homio.yaml (name + path must match the view).
# Paths are the Homio dashboard URLs: /dashboard-homio/<path>.
# First entry is the way back to the Perch board. It is NOT a room page:
# the Perch app runs on its own port (8099), so this card uses the url
# action (same tab) instead of the template's navigate action, which only
# works for HA-internal paths. LAN URL (Trevor-confirmed working); remote
# access needs the remote board URL once that is set up. variables.path is
# kept (empty) so the template's active-underline check never sees an
# undefined variable.
- type: custom:button-card
  template:
    - homio_nav_button
  name: Perch at a Glance
  variables:
    path: ""
  tap_action:
    action: url
    url_path: "http://192.168.5.131:8099/"
- type: custom:button-card
  template:
    - homio_nav_button
  name: Welcome
  variables:
    path: /dashboard-homio/welcome
