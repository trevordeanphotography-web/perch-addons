# Homio dashboard for The Perch (Trevor Rideout)
# Status: 2026-11-25 ~00:52 NST. ALL rooms built from TWO verified sources:
# (1) the live HA entity pull 2026-11-23 (596 entities,
# ha-states-2026-11-23.json) and (2) Trevor's Google Home screenshots
# 2026-11-23 ~21:02-21:09. Consolidated 2026-11-25 (Trevor): 14 views ->
# 11. Exterior holds Front Yard + Driveway + Backyard (backyard photo is
# the hero); Bathroom merged into Hallway; Kitchen covers kitchen + dining
# (photo shows both). Room pages no longer mirror Google Home 1:1.
#
# Interaction model (from homio_light.yaml — tell Leslie this once):
#   tap a light that is OFF  -> turns it ON
#   tap a light that is ON   -> does nothing (avoids accidental switch-offs)
#   hold a light that is ON  -> turns it OFF
#   slider appears under a light that is ON -> drag to dim
#   tap a switch/plug/speaker -> toggles it
#   tap the Mudroom Door lock -> locks / unlocks it
#   tap the Alarm -> opens HA's alarm dialog (arm home / arm away / disarm)
#   hold the Alarm -> arms Away immediately (one gesture when heading out)
#
# Alarm + lock, decided by Trevor 2026-11-23 ("alarm and door lock would be
# handy to have"): both are live controls now, NOT state-only. The alarm
# entity reports code_format: None, so HA arms/disarms it with no code —
# the dialog works straight away. A plain toggle card would NOT have worked
# for the alarm (alarm panels have no toggle service), which is why tap is
# more-info and hold is an explicit arm-away service call.
#
# Corrections vs the first draft (the screenshots settled these):
# - Pot Lights 1-4 are ALL Kitchen (Google Home + the kitchen pot-light
#   automations). The HA entity IDs light.living_room_1/2 ("Pot Light 3/4")
#   are misleading Tuya names — the living room has no pot lights at all.
#   Living Room lights are Black Lamp + White Lamp + Christmas Tree only.
# - "Reading Lamp" in the living room IS the Christmas tree:
#   switch.living_room_reading_lamp_socket, whose HA friendly name is
#   already "Christmas Tree". It is labelled Christmas Tree here.
# - The master bedroom has a SECOND, different Reading Lamp (On 4% in
#   Google Home) — see "Not in HA" below.
# - Fancy Lights appears TWICE in Google Home (one Off, one Offline). The
#   Offline one is the dead switch.mini_plug_socket (unavailable since
#   Nov 14); only the live switch.mini_plug_4_socket_2 is on the Backyard
#   page. Worth removing the dead one from the Google Home room.
# - Fire TV live entities are the long-ID ones (living_room_living_room_
#   fire_tv, master_master_fire_tv_2, garage_garage_fire_tv). The short
#   duplicates (living_room_fire_tv "Main Fire TV", master_master_fire_tv,
#   garage_android_tv_192_168_4_44, our_tv "Garage TV") are off/unavailable.
#
# NOT in HA (in Google Home but no HA entity — cannot go on a Homio page):
# - Master Light 1-4, master Reading Lamp, Master Closet light, Worklight
#   (garage), Oven upper (kitchen). Either Google-Home-only devices or on
#   non-smart hardware. Master Closet gets no page (zero HA entities).
# - No temp/humidity sensors and no climate entities anywhere, so room
#   heroes show photo + name only (show_temp / show_humid stay off) and
#   homio_thermostat is unused. No cover entities: garage doors are lights.
# - Icons must be one of the 19 shipped SVGs (lamp, pendent, plug, door,
#   apple_tv, power_on, power_off, ...). The README example's `tv` and
#   `window` icons do NOT exist in the zip, so Fire TVs use apple_tv and
#   speakers use power_on (no speaker icon shipped yet).
#
# Photos staged (see www/images/Homio/rooms/README.md): welcome.jpg (front
# of house, Welcome hero), exterior.jpg (backyard, Exterior hero),
# mudroom.jpg, garage.jpg, kitchen.jpg, makeup.jpg (all Trevor, Nov 25,
# washed to match). Still NEEDED: living_room, den, hallway, master,
# nursery. A room whose photo is missing still works — the hero just has
# no background until the photo lands.
#
# Still open: boys' rooms (Robbie Dean / Keagan) were not in this batch of
# screenshots — if they are Google Home rooms, send those and they get
# pages. The Fire tablets (media_player.robbie_deans_fire,
# media_player.keagans_fire) are the only per-boy entities found so far.

button_card_templates: !include_dir_merge_named /config/dashboards/templates/button_cards
views:
  - type: custom:grid-layout
    title: Welcome Home
    path: welcome
    layout: !include /config/dashboards/templates/includes/homio_screen_layout.yaml
    cards:
      - type: custom:button-card
        variables:
          image: welcome
          image_position: center center
        template:
          - homio_room
        name: Welcome Home
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout: !include /config/dashboards/templates/includes/homio_entity_layout.yaml
        cards:
          - type: custom:button-card
            template:
              - homio_entity
            variables:
              icon: power_on
            entity: alarm_control_panel.upper_gullies_perch_alarm
            name: Alarm
            tap_action:
              action: more-info
            hold_action:
              action: call-service
              service: alarm_control_panel.alarm_arm_away
              service_data:
                entity_id: alarm_control_panel.upper_gullies_perch_alarm
          - type: custom:button-card
            template:
              - homio_entity
            variables:
              icon: door
            entity: lock.exterior_mudroom_door
            name: Mudroom Door
          - type: custom:button-card
            template:
              - homio_entity
            variables:
              icon: door
            entity: binary_sensor.front_door
            name: Front Door
          - type: custom:button-card
            template:
              - homio_entity
            variables:
              icon: door
            entity: binary_sensor.patio_door
            name: Patio Door
          - type: custom:button-card
            template:
              - homio_entity
            variables:
              icon: door
            entity: binary_sensor.mud_room_door
            name: Mud Room Door

